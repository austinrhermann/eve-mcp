name: Release
# Push a tag like v0.2.0 (it must match the VERSION file) to publish a release with Eve.zxp and eve-extension.zip.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tag must match VERSION
        run: test "v$(cat VERSION)" = "${GITHUB_REF_NAME}"
      - name: Build
        run: bash scripts/build.sh
      - name: Sign ZXP (self-signed)
        continue-on-error: true
        env:
          ZXP_CERT_COUNTRY: US
          ZXP_CERT_PROVINCE: CA
          ZXP_CERT_ORG: Eve
          ZXP_CERT_NAME: com.austin.eve
          ZXP_CERT_PASSWORD: ${{ secrets.ZXP_CERT_PASSWORD || 'eve-selfsigned' }}
        run: npx --yes zxp-sign -i dist/stage -o dist/Eve.zxp
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Eve.zxp
            dist/eve-extension.zip
