name: Release
# Push a new version to main (edit the VERSION file) or run this workflow by hand to publish a release
# containing Eve.zxp and eve-extension.zip.
on:
  push:
    branches: [main]
    paths: ['VERSION']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-latest  # ZXPSignCmd only ships for macOS/Windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Read version
        id: v
        run: echo "ver=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - name: Build
        run: bash scripts/build.sh
      - name: Sign ZXP (self-signed)
        env:
          ZXP_CERT_PASSWORD: ${{ secrets.ZXP_CERT_PASSWORD || 'eve-selfsigned' }}
        run: bash scripts/sign-zxp.sh
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.ver }}
          name: Eve v${{ steps.v.outputs.ver }}
          generate_release_notes: true
          files: |
            dist/Eve.zxp
            dist/eve-extension.zip
